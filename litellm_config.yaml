model_list:
  - model_name: gpt-4o # Fake Azure deployment name
    litellm_params:
      model: ollama/llama3.2
      api_base: http://ollama:11434

  # Embedding deployment (used by call-azure.py)
  - model_name: text-embedding-3-small
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

litellm_settings:
  drop_params: true # OpenAI SDK sends encoding_format=base64 for embeddings; Ollama rejects it

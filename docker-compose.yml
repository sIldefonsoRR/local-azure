services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11435:11434" # host 11435: a native Ollama app may hold 11434
    volumes:
      - ollama_data:/root/.ollama
    # Start the server, pull models into the volume, then keep serving.
    # $$ escapes $ from Compose interpolation.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        trap 'kill $$pid; wait $$pid; exit 0' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull llama3.2         || echo "WARN: pull llama3.2 failed"
        ollama pull nomic-embed-text || echo "WARN: pull nomic-embed-text failed"
        wait $$pid
    # Healthy only once both models are present, so fake-azure waits for the pull.
    healthcheck:
      test: ["CMD-SHELL", "ollama show llama3.2 >/dev/null && ollama show nomic-embed-text >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15m # first-run download time; failures don't count during this

  fake-azure:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "127.0.0.1:4000:4000" # localhost only: no auth, never expose
    environment:
      LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY: "true"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
